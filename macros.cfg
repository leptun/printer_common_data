[respond]

[display_status]

[pause_resume]
recover_velocity: 120

[gcode_arcs]
resolution: .4

[force_move]
enable_force_move: True

[gcode_macro SEARCH_VARS]
gcode:
    {% set search = params.S|lower %}
    {% set ns = namespace() %}
    {% for item in printer  %}
        {% if ' ' in item %}
            {% set ns.path = ['printer', "['%s']" % (item), ''] %}
        {% else %}
            {% set ns.path = ['printer.', item, ''] %}   
        {% endif %} 

        {% if search in ns.path|lower %}
            { action_respond_info(ns.path|join) }
        {% endif %} 

        {% if printer[item].items() %}
            {% for childkey, child in printer[item].items() recursive %}
                {% set ns.path = ns.path[:loop.depth|int + 1] %}

                {% if ' ' in childkey %}
                    {% set null = ns.path.append("['%s']" % (childkey)) %}
                {% else %}
                    {% set null = ns.path.append(".%s" % (childkey)) %}
                {% endif %} 

                {% if child is mapping  %}
                    { loop(child.items()) }
                {% else %}
                    {% if search in ns.path|lower %}
                        { action_respond_info("%s : %s" % (ns.path|join, child)) }   
                    {% endif %} 
                {% endif %} 
                
            {% endfor %}
        {% endif %} 
    {% endfor %}

[gcode_macro M23]
description: Start print from SD menu
rename_existing: M23.1
gcode:
  {% set escaped_msg = rawparams.split(';', 1)[0].split('\x23', 1)[0]|replace('"', '\\"') %}
  SDCARD_PRINT_FILE FILENAME="{escaped_msg}"

[gcode_macro M73]
rename_existing: M73.1
variable_P: 0.0
variable_R: 0.0
gcode:
    M73.1 P{params.P}
    SET_GCODE_VARIABLE MACRO=M73 VARIABLE=p VALUE={params.P}
    SET_GCODE_VARIABLE MACRO=M73 VARIABLE=r VALUE={params.R}

[idle_timeout]
timeout: 1200
gcode:
    {% if printer.pause_resume.is_paused %}
    M104 S0
    {% else %}
    TURN_OFF_HEATERS
    M84
    {% endif %}

[gcode_macro M900]
gcode =
  {% if params.K is defined %}
    {% if params.K|float() < 1.0 %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% else %}
    SET_PRESSURE_ADVANCE ADVANCE=0
  {% endif %}

# Pressure advance wrapping
[gcode_macro M572]
gcode =
  SET_PRESSURE_ADVANCE {% if params.D is defined %} EXTRUDER={params.D} {% endif %} {% if params.S is defined %} ADVANCE={params.S} {% endif %} {% if params.W is defined %} SMOOTH_TIME={params.W} {% endif %}

