# Wait for extruder temperature
[gcode_macro M109]
rename_existing: M109.1
gcode =
  {% set target_temp = params.S|default(params.R|default(0))|float %}
  {% set heater = "extruder" ~ params.T|default("")|string %}
  {% set hysteresis = 2 %} # (°C) Temperature proximity considered "close enough" to the target
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={target_temp}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={target_temp - hysteresis} {% if params.R is defined %} MAXIMUM={target_temp + hysteresis} {% endif %}

# Wait for bed temperature
[gcode_macro M190]
rename_existing: M190.1
gcode =
  {% set target_temp = params.S|default(params.R|default(0))|float %}
  {% set hysteresis = 1 %} # (°C) Temperature proximity considered "close enough" to the target
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_temp}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target_temp - hysteresis} {% if params.R is defined %} MAXIMUM={target_temp + hysteresis} {% endif %}

# Headbreak target temperature - suppressed
[gcode_macro M142]
gcode =
  #nop

[gcode_macro G80]
gcode =
	SAVE_GCODE_STATE NAME=G80_state
	BED_MESH_CALIBRATE
	G1 X0 Y0 F24000
	G1 Z0.15
	RESTORE_GCODE_STATE NAME=G80_state

[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0

[gcode_macro LOAD_FILAMENT]
gcode = 
    SAVE_GCODE_STATE NAME=__filament__load
    M83
    G1 E40 F400
    G1 E30 F400
    G1 E25 F200
    RESTORE_GCODE_STATE NAME=__filament__load

[gcode_macro UNLOAD_FILAMENT]
gcode = 
    SAVE_GCODE_STATE NAME=__filament__load
    M83
    G1 E-45 F5200
    G1 E-15 F1000
    G1 E-20 F1000
    RESTORE_GCODE_STATE NAME=__filament__load

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  M106 S0
  M84
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  RESUME_BASE {get_params}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

